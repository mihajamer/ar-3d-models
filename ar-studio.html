<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>

  <!-- Load the default model into the scene on first visit.
       The studio reads ?src= and ?title= as documented deep-link parameters. -->
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (!params.has("src")) {
        params.set("src", "https://mihajamer.github.io/ar-3d-models/test1.glb");
        params.set("title", "Test Object 1");
        window.location.replace(
          window.location.pathname + "?" + params.toString() + window.location.hash
        );
      }
    })();
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }

    #studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
  </style>
</head>
<body>
  <div id="studio"></div>

  <script type="module">
    import { createArStudio } from "https://esm.sh/3d-ar-studio@0.3.2?bundle&deps=three@0.184.0";

    createArStudio(document.querySelector("#studio"), {
      assets: "https://mihajamer.github.io/ar-3d-models/models.json",
      branding: {
        title: "Scanned Objects",
        accent: "#2563eb"
      },
      generate: { enabled: false },
      rooms: { enabled: false },
      maxPlacements: 1,
      persist: false
    });
  </script>
</body>
</html>
