<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>

  <!-- Load the default model into the scene on first visit.
       The studio reads ?src= and ?title= as documented deep-link parameters. -->
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (!params.has("src")) {
        params.set("src", "https://mihajamer.github.io/ar-3d-models/test1.glb");
        params.set("title", "Test Object 1");
        window.location.replace(
          window.location.pathname + "?" + params.toString() + window.location.hash
        );
      }
    })();
  </script>

  <script type="module"
    src="https://unpkg.com/3d-ar-studio/dist/ar-studio.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }

    ar-studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
  </style>
</head>
<body>
  <ar-studio
    assets="https://mihajamer.github.io/ar-3d-models/models.json"
    title="Scanned Objects"
    accent="#2563eb"
    generate="false"
    rooms="false">
  </ar-studio>

  <!-- Mobile performance patch:
       use a cheap bounding-sphere hit test instead of raycasting every GLB triangle.
       Also cap rendering to native pixel resolution and disable real-time shadows. -->
  <script type="module">
    await customElements.whenDefined("ar-studio");

    const host = document.querySelector("ar-studio");

    function installPerformancePatch() {
      const studio = host && host.studio;
      if (!studio) {
        requestAnimationFrame(installPerformancePatch);
        return;
      }
      if (studio.__mobilePerformancePatchInstalled) return;
      studio.__mobilePerformancePatchInstalled = true;

      // A 1x render scale is substantially lighter on high-DPI phones.
      // Keep the full GLB textures and geometry unchanged.
      if (studio.renderer) {
        studio.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1));
        studio.renderer.shadowMap.enabled = false;
        studio.renderer.shadowMap.needsUpdate = true;
      }

      // The original method intersects every triangle in every model on touch.
      // A bounding sphere gives fast, approximate selection independent of mesh
      // polygon count. The actual model remains unchanged and renders normally.
      studio._placementAt = function(clientX, clientY) {
        if (!this.placements.length) return null;

        this._setNdc(clientX, clientY);
        this._raycaster.setFromCamera(this._ndc, this.camera);

        const ray = this._raycaster.ray;
        const ox = ray.origin.x;
        const oy = ray.origin.y;
        const oz = ray.origin.z;
        const dx = ray.direction.x;
        const dy = ray.direction.y;
        const dz = ray.direction.z;

        let nearest = null;
        let nearestT = Infinity;

        for (const p of this.placements) {
          const scale = Math.abs(p.group.scale.x || 1);
          const height = Math.max(0.05, (p.height || 0.7) * scale);
          const radius = Math.max(0.08, (p.baseRadius || 0.3) * scale);
          const sphereRadius = Math.hypot(radius, height * 0.5);

          const cx = p.group.position.x;
          const cy = p.group.position.y + height * 0.5;
          const cz = p.group.position.z;

          const vx = ox - cx;
          const vy = oy - cy;
          const vz = oz - cz;

          const b = vx * dx + vy * dy + vz * dz;
          const c = vx * vx + vy * vy + vz * vz - sphereRadius * sphereRadius;
          const discriminant = b * b - c;
          if (discriminant < 0) continue;

          const root = Math.sqrt(discriminant);
          let t = -b - root;
          if (t < 0) t = -b + root;

          if (t >= 0 && t < nearestT) {
            nearestT = t;
            nearest = p;
          }
        }

        return nearest;
      };
    }

    installPerformancePatch();
  </script>

</body>
</html>
