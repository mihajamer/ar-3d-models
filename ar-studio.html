<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }
    #studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
    #startup-error {
      position: fixed;
      z-index: 99999;
      inset: 12px 12px auto;
      padding: 14px;
      border-radius: 10px;
      background: #3b1515;
      color: white;
      font: 14px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="studio"></div>
  <div id="startup-error" hidden></div>

  <script type="module">
    const errorBox = document.querySelector("#startup-error");

    function showStartupError(error) {
      console.error("AR Studio startup failed:", error);
      errorBox.hidden = false;
      errorBox.textContent =
        "AR Studio could not start. Please reload the page.\n\n" +
        (error?.message || String(error));
    }

    try {
      const { createArStudio } = await import(
        "https://unpkg.com/3d-ar-studio@0.3.1/dist/ar-studio.min.js"
      );

      if (typeof createArStudio !== "function") {
        throw new Error("The AR Studio bundle loaded, but createArStudio was not exported.");
      }

      const studio = createArStudio(document.querySelector("#studio"), {
        assets: "https://mihajamer.github.io/ar-3d-models/models.json",
        branding: { title: "Scanned Objects", accent: "#2563eb" },
        generate: { enabled: false },
        rooms: { enabled: false },
        animations: { enabled: false },
        maxPlacements: 1,
        persist: false,
        allowUrlOverride: false
      });

      // Keep the regular preview lightweight.
      studio.renderer.setPixelRatio(0.8);
      studio.renderer.shadowMap.enabled = false;
      studio._makeShadow = () => null;

      // WebXR has a separate framebuffer scale from the regular renderer.
      if (typeof studio.renderer.xr.setFramebufferScaleFactor === "function") {
        studio.renderer.xr.setFramebufferScaleFactor(0.7);
      }

      // Reserve the only model slot while an asynchronous model load is pending.
      const originalAddModel = studio._addModel.bind(studio);
      let pendingPlacements = 0;
      studio._addModel = async function (model, options) {
        const limit = this._maxPlacements;
        if (this.placements.length + pendingPlacements >= limit) {
          this._setStatus("Only one model is allowed. Remove it before adding another.", { warn: true });
          return null;
        }
        pendingPlacements += 1;
        try {
          return await originalAddModel(model, options);
        } finally {
          pendingPlacements -= 1;
        }
      };

      const originalArmedContent = studio._armedContent.bind(studio);
      studio._armedContent = function () {
        if (this.placements.length >= this._maxPlacements) {
          this._setStatus("Only one model is allowed. Remove it before adding another.", { warn: true });
          return null;
        }
        return originalArmedContent();
      };

      // Add direct manipulation for the one placed model in immersive AR:
      // one finger drags it across the horizontal floor plane; two fingers
      // scale and rotate it. HUD controls retain their normal behaviour.
      function installArGestures(xr) {
        const root = xr._domOverlayRoot;
        if (!root || xr._arGestureHandlersInstalled) return;
        xr._arGestureHandlersInstalled = true;
        // The library normally lets empty HUD space pass touches through to its canvas.
        // Make the full-screen overlay receive background touches during manipulation.
        root.style.pointerEvents = "auto";
        xr._session?.addEventListener("end", () => { root.style.pointerEvents = ""; }, { once: true });

        let gesture = null;
        const Vector3 = xr._camera.position.constructor;
        const getModel = () => studio.placements[studio.placements.length - 1] || null;
        const isHudControl = (target) => !!target?.closest?.(
          'button, a, input, select, textarea, [role="button"], .ars-dock, .ars-tray, .ars-modal, .ars-top, .ars-selbar'
        );

        function stopEvent(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }

        function getWorldPerPixel(model) {
          const camera = xr._camera;
          camera.updateMatrixWorld(true);
          const cameraPos = camera.getWorldPosition(new Vector3());
          const modelPos = model.group.getWorldPosition(new Vector3());
          const distance = Math.max(0.35, cameraPos.distanceTo(modelPos));
          const fov = (camera.fov || 60) * Math.PI / 180;
          return (2 * distance * Math.tan(fov / 2)) / Math.max(1, root.clientHeight);
        }

        function touchAngle(touches) {
          return Math.atan2(
            touches[1].clientY - touches[0].clientY,
            touches[1].clientX - touches[0].clientX
          );
        }

        function onStart(e) {
          if (isHudControl(e.target)) return;
          const model = getModel();
          if (!model || (e.touches.length !== 1 && e.touches.length !== 2)) return;
          stopEvent(e);

          const group = model.group;
          const touches = e.touches;
          gesture = {
            model,
            startX: touches[0].clientX,
            startY: touches[0].clientY,
            startPosition: group.position.clone(),
            startScale: group.scale.x,
            startYaw: group.rotation.y,
            startDistance: touches.length === 2
              ? Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY)
              : 0,
            startAngle: touches.length === 2 ? touchAngle(touches) : 0,
            worldPerPixel: getWorldPerPixel(model),
            mode: touches.length === 2 ? "transform" : "drag"
          };
          xr._uiTouchActive = true;
          xr._pinch.active = true;
        }

        function onMove(e) {
          if (!gesture || e.touches.length !== (gesture.mode === "transform" ? 2 : 1)) return;
          stopEvent(e);
          const group = gesture.model.group;

          if (gesture.mode === "drag") {
            const dx = e.touches[0].clientX - gesture.startX;
            const dy = e.touches[0].clientY - gesture.startY;
            const camera = xr._camera;
            const forward = camera.getWorldDirection(new Vector3());
            forward.y = 0;
            if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
            forward.normalize();
            const right = new Vector3(forward.z, 0, -forward.x).normalize();
            group.position.copy(gesture.startPosition)
              .addScaledVector(right, dx * gesture.worldPerPixel)
              .addScaledVector(forward, -dy * gesture.worldPerPixel);
          } else {
            const distance = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            const angle = touchAngle(e.touches);
            const scale = Math.max(0.05, Math.min(5, gesture.startScale * distance / Math.max(1, gesture.startDistance)));
            group.scale.setScalar(scale);
            group.rotation.y = gesture.startYaw + angle - gesture.startAngle;
            gesture.model.yaw = group.rotation.y;
          }
        }

        function onEnd(e) {
          if (!gesture) return;
          stopEvent(e);
          if (!e.touches || e.touches.length === 0) {
            gesture = null;
            xr._uiTouchActive = false;
            xr._pinch.active = false;
            xr._pinchEndedAt = performance.now();
            studio._saveScene();
          }
        }

        root.addEventListener("touchstart", onStart, { capture: true, passive: false });
        root.addEventListener("touchmove", onMove, { capture: true, passive: false });
        root.addEventListener("touchend", onEnd, { capture: true, passive: false });
        root.addEventListener("touchcancel", onEnd, { capture: true, passive: false });
      }

      // After the first placement, stop work that only exists to find another
      // placement. Keep the XR render loop and anchor pose updates so the model
      // remains locked to the real room.
      function reduceWorkAfterPlacement(xr) {
        if (!xr || xr._singleModelOptimized) return;
        xr._singleModelOptimized = true;

        if (xr._hitTestSource) {
          try { xr._hitTestSource.cancel(); } catch (error) {
            console.warn("Could not cancel XR hit-test source:", error);
          }
          xr._hitTestSource = null;
        }
        xr._latestHit = null;
        xr._hasHit = false;
        xr._hadHit = false;

        for (const object of [xr._reticle, xr._pulseRing]) {
          if (!object) continue;
          xr._scene.remove(object);
          object.traverse?.((child) => {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose?.());
            else child.material?.dispose?.();
          });
        }
        xr._reticle = null;
        xr._reticleRing = null;
        xr._reticleDot = null;
        xr._pulseRing = null;
        xr._pulse.active = false;

        // The scanned object is static: no per-frame mixer/idle animation work.
        xr._onFrame = null;

        // Depth processing and real-world light estimation are not needed for
        // this simple single-object viewer.
        if (xr._depthOcclusion) {
          xr._depthOcclusion.dispose();
          xr._depthOcclusion = null;
        }
        if (studio.estimatedLight) {
          studio.estimatedLight.dispose();
          studio.estimatedLight = null;
        }

        installArGestures(xr);
        studio._setStatus("Model placed. Drag with one finger; pinch to resize and twist to rotate.");
      }

      // Do not even request optional depth-sensing or light-estimation features.
      // This prevents the AR runtime from enabling those optional pipelines.
      const originalToggleXR = studio._toggleXR.bind(studio);
      studio._toggleXR = async function (...args) {
        const xrApi = navigator.xr;
        const hadOwnRequestSession = Object.prototype.hasOwnProperty.call(xrApi, "requestSession");
        const originalRequestSession = xrApi.requestSession;
        let requestSessionPatched = false;

        try {
          xrApi.requestSession = function (mode, init = {}) {
            const options = { ...init };
            options.optionalFeatures = (init.optionalFeatures || []).filter(
              (feature) => feature !== "depth-sensing" && feature !== "light-estimation"
            );
            delete options.depthSensing;
            return originalRequestSession.call(this, mode, options);
          };
          requestSessionPatched = true;
        } catch (error) {
          console.warn("Could not filter optional WebXR features:", error);
        }

        try {
          await originalToggleXR(...args);
        } finally {
          if (requestSessionPatched) {
            try {
              if (hadOwnRequestSession) xrApi.requestSession = originalRequestSession;
              else delete xrApi.requestSession;
            } catch (error) {
              console.warn("Could not restore WebXR requestSession:", error);
            }
          }
        }

        const xr = this.xrSession;
        if (!xr) return;

        // Keep this in place for the first placement and run it immediately if
        // the model was already placed before entering AR.
        if (xr.placedCount > 0) reduceWorkAfterPlacement(xr);
        const previousOnPlaced = xr._onPlaced;
        xr._onPlaced = (...placedArgs) => {
          previousOnPlaced?.(...placedArgs);
          reduceWorkAfterPlacement(xr);
        };
      };

      const firstPlacement = await studio.addModel({
        src: "https://mihajamer.github.io/ar-3d-models/test1.glb",
        title: "Test Object 1"
      });

      if (!firstPlacement) {
        console.warn("The initial model was not placed. Check the model URL and CORS response.");
      }
    } catch (error) {
      showStartupError(error);
    }
  </script>
</body>
</html>
