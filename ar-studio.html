<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }

    #studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
  </style>
</head>
<body>
  <div id="studio"></div>

  <script type="module">
    import { createArStudio } from "https://unpkg.com/3d-ar-studio@0.3.2/dist/ar-studio.min.js";

    const studio = createArStudio(document.querySelector("#studio"), {
      assets: "https://mihajamer.github.io/ar-3d-models/models.json",
      branding: {
        title: "Scanned Objects",
        accent: "#2563eb"
      },
      generate: { enabled: false },
      rooms: { enabled: false },
      maxPlacements: 1,
      persist: false,
      allowUrlOverride: false
    });

    // The library checks placements.length before awaiting the GLB load.
    // Reserve a slot immediately so rapid taps cannot start parallel loads.
    const originalAddModel = studio._addModel.bind(studio);
    let pendingPlacements = 0;

    studio._addModel = async function (...args) {
      if (this.placements.length + pendingPlacements >= 1) {
        this._setStatus("Scene is full (1 model). Remove it before adding another.", { warn: true });
        return null;
      }

      pendingPlacements += 1;
      try {
        return await originalAddModel(...args);
      } finally {
        pendingPlacements -= 1;
      }
    };

    // Add the initial model through the same guarded path as every later add.
    studio.addModel({
      src: "https://mihajamer.github.io/ar-3d-models/test1.glb",
      title: "Test Object 1"
    });
  </script>
</body>
</html>
