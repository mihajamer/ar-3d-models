
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">

  <title>Scanned Objects - AR Studio</title>

  <!-- Load 3D AR Studio -->
  <script
    type="module"
    src="https://unpkg.com/3d-ar-studio/dist/ar-studio.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 320px;
    }

    ar-studio {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 320px;
    }

    .load-error {
      position: absolute;
      z-index: 10;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff;
      color: #333;
      box-shadow: 0 2px 12px #0002;
      font-size: 14px;
      line-height: 1.4;
    }

    .load-error[hidden] {
      display: none;
    }
  </style>
</head>

<body>

  <main>

    <!--
      Load your own model catalogue.

      Android:
      WebXR where supported, with Scene Viewer fallback.

      iPhone:
      USDZ conversion and Apple Quick Look.

      Desktop:
      Interactive 3D preview.
    -->

    <ar-studio
      assets="./models.json"
      title="Scanned Objects"
      accent="#2563eb"
      generate="false"
      rooms="false">
    </ar-studio>

    <div class="load-error" id="load-error" hidden>
      The AR Studio did not load.
      Check your internet connection and reload this page.
    </div>

  </main>

  <script>
    // Check whether the AR Studio component loaded correctly.

    window.addEventListener('load', () => {

      window.setTimeout(() => {

        if (!customElements.get('ar-studio')) {
          document.getElementById('load-error').hidden = false;
        }

      }, 5000);

    });
  </script>

</body>
</html>
