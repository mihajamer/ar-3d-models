<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }
    #studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
    #version-label {
      position: fixed;
      z-index: 99998;
      top: calc(10px + env(safe-area-inset-top));
      left: calc(10px + env(safe-area-inset-left));
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 8px;
      background: rgba(12, 16, 25, 0.82);
      color: #fff;
      font: 600 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.2px;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #startup-error {
      position: fixed;
      z-index: 99999;
      inset: 12px 12px auto;
      padding: 14px;
      border-radius: 10px;
      background: #3b1515;
      color: white;
      font: 14px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="studio"></div>
  <div id="version-label">AR Studio · Version 7.1</div>
  <div id="startup-error" hidden></div>

  <script type="module">
    const errorBox = document.querySelector("#startup-error");

    function showStartupError(error) {
      console.error("AR Studio startup failed:", error);
      errorBox.hidden = false;
      errorBox.textContent =
        "AR Studio could not start. Please reload the page.\n\n" +
        (error?.message || String(error));
    }

    try {
      const { createArStudio } = await import(
        "https://unpkg.com/3d-ar-studio@0.3.1/dist/ar-studio.min.js"
      );

      if (typeof createArStudio !== "function") {
        throw new Error("The AR Studio bundle loaded, but createArStudio was not exported.");
      }

      // Create the WebGL context with multisampling disabled. In Three.js this
      // attribute is also used when WebXR creates its projection layer.
      const canvasPrototype = HTMLCanvasElement.prototype;
      const originalGetContext = canvasPrototype.getContext;
      let studio;
      canvasPrototype.getContext = function (type, attributes) {
        if (type === "webgl2" || type === "webgl" || type === "experimental-webgl") {
          return originalGetContext.call(this, type, {
            ...(attributes || {}),
            antialias: false,
            powerPreference: "high-performance"
          });
        }
        return originalGetContext.call(this, type, attributes);
      };

      try {
        studio = createArStudio(document.querySelector("#studio"), {
          assets: "https://mihajamer.github.io/ar-3d-models/models.json",
          branding: { title: "Scanned Objects", accent: "#2563eb" },
          generate: { enabled: false },
          rooms: { enabled: false },
          animations: { enabled: false },
          lighting: { preset: null },
          maxPlacements: 1,
          persist: false,
          allowUrlOverride: false
        });
      } finally {
        canvasPrototype.getContext = originalGetContext;
      }

      const actualContextAttributes = studio.renderer.getContext().getContextAttributes?.();
      console.info("AR Studio WebGL context attributes:", actualContextAttributes);

      // The procedural room environment is not needed for this scanned,
      // non-metallic model. Skip the remote HDRI and use the simple scene lights.
      studio.scene.environment = null;

      // Keep the regular preview lightweight.
      studio.renderer.setPixelRatio(0.8);
      studio.renderer.shadowMap.enabled = false;
      studio._makeShadow = () => null;

      // WebXR has a separate framebuffer scale from the regular renderer.
      if (typeof studio.renderer.xr.setFramebufferScaleFactor === "function") {
        studio.renderer.xr.setFramebufferScaleFactor(0.6);
      }

      // WebXR is a two-step operation: prepare a model, then place that exact
      // model only after the live floor hit-test has produced the reticle.
      // Never create an ordinary preview placement while using the WebXR flow.
      // Rotate around the model's horizontal centre, while keeping its
      // lowest point on the floor. The upstream placement group is anchored at
      // the hit-test point; without this offset, off-centre GLB origins swing
      // around that floor point when the user twists the model.
      function getModelBounds(tpl) {
        const source = tpl?.gltf?.scene;
        if (!source) return null;

        source.updateMatrixWorld(true);
        const Vector = studio.camera.position.constructor;
        const min = new Vector(Infinity, Infinity, Infinity);
        const max = new Vector(-Infinity, -Infinity, -Infinity);
        let found = false;

        source.traverse((mesh) => {
          if (!mesh.isMesh || !mesh.geometry) return;
          const geometry = mesh.geometry;
          if (!geometry.boundingBox) geometry.computeBoundingBox();
          const box = geometry.boundingBox;
          if (!box) return;

          for (let ix = 0; ix < 2; ix++) {
            for (let iy = 0; iy < 2; iy++) {
              for (let iz = 0; iz < 2; iz++) {
                const point = new Vector(
                  ix ? box.max.x : box.min.x,
                  iy ? box.max.y : box.min.y,
                  iz ? box.max.z : box.min.z
                ).applyMatrix4(mesh.matrixWorld);
                min.min(point);
                max.max(point);
                found = true;
              }
            }
          }
        });

        return found ? { min, max } : null;
      }

      function getHorizontalModelCenter(tpl) {
        const bounds = getModelBounds(tpl);
        return bounds
          ? { x: (bounds.min.x + bounds.max.x) * 0.5, z: (bounds.min.z + bounds.max.z) * 0.5 }
          : { x: 0, z: 0 };
      }

      const originalInstantiate = studio._instantiate.bind(studio);
      studio._instantiate = function (tpl, src) {
        const result = originalInstantiate(tpl, src);
        const inner = result.group.children?.[0];
        if (inner) {
          const center = getHorizontalModelCenter(tpl);
          inner.position.x = -center.x * tpl.fit.scale;
          inner.position.z = -center.z * tpl.fit.scale;
        }
        return result;
      };

      const originalAddModel = studio._addModel.bind(studio);
      let pendingPlacements = 0;

      function setArAddControls(xr, hasFloor = !!xr?._hasHit) {
        // Outside immersive AR, allow the user to change the prepared model.
        // Inside AR, unlock Add only while a fresh floor hit is available.
        const canAdd = !xr
          ? studio.placements.length < studio._maxPlacements && pendingPlacements === 0
          : !!hasFloor &&
            xr.placedCount < 1 &&
            studio.placements.length < studio._maxPlacements &&
            !studio._armed?.src &&
            pendingPlacements === 0;

        const controls = [
          studio.ui.addBtn,
          studio.ui.emptyAdd,
          ...((studio.ui.root?.querySelectorAll(".ars-item-add")) || [])
        ].filter(Boolean);

        for (const control of controls) {
          control.disabled = !canAdd;
          control.setAttribute("aria-disabled", String(!canAdd));
          if (!canAdd && xr && !hasFloor) {
            control.title = "Point at a floor until the placement circle appears.";
          } else if (!canAdd) {
            control.title = "A model is already loading or placed.";
          } else {
            control.removeAttribute("title");
          }
        }
      }

      studio._addModel = async function (model, options = {}) {
        const url = String(model?.src || "").trim();
        const useWebXRFlow = this.arMode === "webxr" || !!this.xrSession;

        if (useWebXRFlow && !options.remote && url) {
          const xr = this.xrSession;

          if (xr && !xr._hasHit) {
            this._setStatus("Point at a floor until the placement circle appears. You can add a model once it is visible.", {
              warn: true, sticky: true
            });
            return null;
          }
          if (this.placements.length + pendingPlacements >= this._maxPlacements ||
              (xr?.placedCount || 0) >= 1) {
            this._setStatus("Only one model is allowed. Remove it before adding another.", { warn: true });
            return null;
          }
          if (xr && this._armed?.src) {
            this._setStatus("A model is already ready. Tap the placement circle to place it.", { sticky: true });
            return null;
          }

          pendingPlacements += 1;
          setArAddControls(xr, !!xr?._hasHit);
          try {
            await this._loadTemplate(url);

            // The floor must still be detected when loading finishes. Otherwise
            // leave the model unarmed so the user cannot add something that
            // currently has nowhere valid to be placed.
            if (this.xrSession && !this.xrSession._hasHit) {
              this._setStatus("The floor was lost while loading. Wait for the placement circle, then add the model again.", {
                warn: true, sticky: true
              });
              return null;
            }

            this._armed = { src: url, title: String(model?.title || "") };
            this._setStatus(this.xrSession
              ? "Model ready. Tap the visible placement circle to place it."
              : "Model ready. Enter AR, wait for the placement circle, then tap it once.");
            setArAddControls(this.xrSession, !!this.xrSession?._hasHit);
            return null;
          } catch (error) {
            console.error("Could not prepare model for AR:", error);
            this._setStatus("Could not load this model. Check the connection and try again.", { warn: true });
            return null;
          } finally {
            pendingPlacements -= 1;
            setArAddControls(this.xrSession, !!this.xrSession?._hasHit);
          }
        }

        pendingPlacements += 1;
        try {
          return await originalAddModel(model, options);
        } finally {
          pendingPlacements -= 1;
        }
      };

      const originalArmedContent = studio._armedContent.bind(studio);
      studio._armedContent = function () {
        // The catalogue model already exists in the preview scene. Limit only
        // the number of objects placed into the live XR session, not that source.
        if ((this.xrSession?.placedCount || 0) >= 1) {
          this._setStatus("Only one model is allowed in AR.", { warn: true });
          return null;
        }
        return originalArmedContent();
      };

      // Add direct manipulation for the one placed model in immersive AR:
      // one finger drags it across the horizontal floor plane; two fingers
      // scale and rotate it. HUD controls retain their normal behaviour.
      function installArGestures(xr) {
        const root = xr._domOverlayRoot;
        if (!root || xr._arGestureHandlersInstalled) return;
        xr._arGestureHandlersInstalled = true;

        // Capture touches on the otherwise transparent HUD background.
        root.style.pointerEvents = "auto";
        xr._session?.addEventListener("end", () => { root.style.pointerEvents = ""; }, { once: true });

        let gesture = null;
        const Vector3 = xr._camera.position.constructor;

        // MultiPlaceSession refreshes anchored positions during _tick().
        // Apply user drag offsets after that refresh but immediately before
        // drawing, so the anchor can keep tracking the room without undoing
        // the user's deliberate repositioning.
        const renderer = xr._renderer;

        // Small live diagnostic: lets us compare real XR frame rate and the
        // actual draw workload on the phone rather than guessing from feel.
        let perfBadge = root.querySelector("#ar-performance");
        if (!perfBadge) {
          perfBadge = document.createElement("div");
          perfBadge.id = "ar-performance";
          Object.assign(perfBadge.style, {
            position: "absolute",
            top: "calc(env(safe-area-inset-top, 0px) + 10px)",
            right: "10px",
            zIndex: "99999",
            padding: "6px 8px",
            borderRadius: "7px",
            background: "rgba(0,0,0,0.68)",
            color: "#fff",
            font: "11px/1.25 Arial, sans-serif",
            pointerEvents: "none",
            whiteSpace: "nowrap"
          });
          perfBadge.textContent = "FPS: measuring…";
          root.appendChild(perfBadge);
        }
        let perfFrames = 0;
        let perfWindowStart = performance.now();

        // Lightweight DOM information markers. Their positions are projected
        // from model-local coordinates each XR frame, so they follow drag,
        // rotation, scaling and the room anchor without adding 3D draw calls.
        const infoItems = [
          {
            title: "Outer shell",
            body: "The outer shell is made from a lightweight composite to reduce the model's overall mass."
          },
          {
            title: "Airflow channel",
            body: "This section is shaped to guide airflow around the central assembly."
          },
          {
            title: "Surface finish",
            body: "The fine surface texture is designed to make small scratches less noticeable."
          }
        ];

        const infoToggle = document.createElement("button");
        infoToggle.type = "button";
        infoToggle.textContent = "ⓘ Info";
        Object.assign(infoToggle.style, {
          position: "absolute",
          right: "14px",
          bottom: "calc(env(safe-area-inset-bottom, 0px) + 82px)",
          zIndex: "100002",
          padding: "11px 15px",
          border: "1px solid rgba(255,255,255,0.35)",
          borderRadius: "22px",
          background: "rgba(12,16,25,0.88)",
          color: "#fff",
          font: "600 14px Arial, sans-serif",
          pointerEvents: "auto",
          touchAction: "manipulation"
        });
        root.appendChild(infoToggle);

        // Vertical lift control. Its value is a positive offset from the
        // original floor anchor, so it can raise the model but never lower
        // its base through the floor.
        const heightControl = document.createElement("div");
        Object.assign(heightControl.style, {
          position: "absolute",
          left: "12px",
          top: "50%",
          transform: "translateY(-50%)",
          zIndex: "100002",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          gap: "9px",
          padding: "11px 8px",
          border: "1px solid rgba(255,255,255,0.28)",
          borderRadius: "16px",
          background: "rgba(12,16,25,0.82)",
          color: "#fff",
          font: "600 10px Arial, sans-serif",
          pointerEvents: "auto",
          touchAction: "none"
        });
        heightValue.textContent = "0 cm";
        const heightSlider = document.createElement("input");
        heightSlider.type = "range";
        heightSlider.min = "0";
        heightSlider.max = "200";
        heightSlider.step = "1";
        heightSlider.value = "0";
        heightSlider.setAttribute("aria-label", "Raise model above floor");
        Object.assign(heightSlider.style, {
          appearance: "slider-vertical",
          WebkitAppearance: "slider-vertical",
          writingMode: "vertical-lr",
          direction: "rtl",
          width: "30px",
          height: "190px",
          margin: "0",
          padding: "0",
          accentColor: "#60a5fa",
          touchAction: "none",
          cursor: "pointer"
        });
        heightControl.append(heightSlider);
        root.appendChild(heightControl);

        function setModelHeightFromSlider(save = false) {
          const model = getModel();
          const placement = model && xr._placements?.find((item) => item.group === model.group);
          if (!placement) return;
          if (!placement._userOffset) placement._userOffset = new Vector3();
          const heightCm = Number(heightSlider.value);
          placement._userOffset.y = heightCm / 100;
          if (save) {
            model.group.position.add(placement._userOffset);
            try { studio._saveScene(); }
            finally { model.group.position.sub(placement._userOffset); }
          }
        }
        heightSlider.addEventListener("input", () => setModelHeightFromSlider(false));
        heightSlider.addEventListener("change", () => setModelHeightFromSlider(true));

        const infoPanel = document.createElement("div");
        Object.assign(infoPanel.style, {
          position: "absolute",
          left: "50%",
          bottom: "calc(env(safe-area-inset-bottom, 0px) + 132px)",
          transform: "translateX(-50%)",
          width: "min(290px, calc(100vw - 32px))",
          zIndex: "100003",
          padding: "14px 42px 14px 15px",
          border: "1px solid rgba(255,255,255,0.22)",
          borderRadius: "12px",
          background: "rgba(12,16,25,0.94)",
          color: "#fff",
          font: "14px/1.4 Arial, sans-serif",
          pointerEvents: "auto",
          boxShadow: "0 4px 18px rgba(0,0,0,0.25)",
          display: "none"
        });

        const infoTitle = document.createElement("div");
        Object.assign(infoTitle.style, { fontWeight: "700", marginBottom: "5px" });
        const infoBody = document.createElement("div");
        Object.assign(infoBody.style, { opacity: "0.92" });
        const infoClose = document.createElement("button");
        infoClose.type = "button";
        infoClose.textContent = "×";
        Object.assign(infoClose.style, {
          position: "absolute",
          top: "5px",
          right: "8px",
          border: "0",
          background: "transparent",
          color: "#fff",
          font: "24px/1 Arial, sans-serif",
          padding: "4px 7px",
          pointerEvents: "auto"
        });
        infoPanel.append(infoTitle, infoBody, infoClose);
        root.appendChild(infoPanel);

        const infoMarkers = infoItems.map((item, index) => {
          const marker = document.createElement("button");
          marker.type = "button";
          marker.textContent = String(index + 1);
          marker.setAttribute("aria-label", `Show information: ${item.title}`);
          Object.assign(marker.style, {
            position: "absolute",
            left: "0",
            top: "0",
            transform: "translate(-50%, -50%)",
            width: "36px",
            height: "36px",
            border: "2px solid #fff",
            borderRadius: "50%",
            background: "#2563eb",
            color: "#fff",
            font: "700 14px Arial, sans-serif",
            boxShadow: "0 2px 8px rgba(0,0,0,0.45)",
            zIndex: "100001",
            pointerEvents: "auto",
            display: "none",
            touchAction: "manipulation"
          });
          marker.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            infoTitle.textContent = item.title;
            infoBody.textContent = item.body;
            infoPanel.style.display = "block";
          });
          root.appendChild(marker);
          return marker;
        });

        let infoVisible = false;
        infoToggle.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          infoVisible = !infoVisible;
          for (const marker of infoMarkers) marker.style.display = infoVisible ? "block" : "none";
          if (!infoVisible) infoPanel.style.display = "none";
          infoToggle.textContent = infoVisible ? "✕ Hide info" : "ⓘ Info";
        });
        infoClose.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          infoPanel.style.display = "none";
        });

        let infoPointCache = null;

        function updateInfoMarkers() {
          if (!infoVisible) return;
          const model = getModel();
          if (!model) {
            for (const marker of infoMarkers) marker.style.display = "none";
            return;
          }

          if (!infoPointCache || infoPointCache.src !== model.src) {
            const tpl = studio._templatesReady.get(model.src);
            const bounds = tpl && getModelBounds(tpl);
            const inner = model.group.children?.[0];
            if (!bounds || !inner) {
              for (const marker of infoMarkers) marker.style.display = "none";
              return;
            }

            const min = bounds.min;
            const max = bounds.max;
            const centerX = (min.x + max.x) * 0.5;
            const centerZ = (min.z + max.z) * 0.5;
            const height = Math.max(0.001, max.y - min.y);
            const scale = tpl.fit.scale;
            infoPointCache = {
              src: model.src,
              points: [
                new Vector3(centerX, min.y + height * 0.86, max.z),
                new Vector3(min.x, min.y + height * 0.56, centerZ),
                new Vector3(max.x, min.y + height * 0.34, centerZ)
              ].map((point) => point.multiplyScalar(scale).add(inner.position))
            };
          }

          const localPoints = infoPointCache.points;
          const xrCamera = renderer.xr.getCamera(xr._camera);
          const viewCamera = xrCamera.cameras?.[0] || xrCamera;
          viewCamera.updateMatrixWorld(true);
          model.group.updateMatrixWorld(true);
          const rect = root.getBoundingClientRect();

          localPoints.forEach((localPoint, index) => {
            const projected = model.group.localToWorld(localPoint.clone()).project(viewCamera);
            const visible = projected.z >= -1 && projected.z <= 1 &&
              projected.x >= -1.15 && projected.x <= 1.15 &&
              projected.y >= -1.15 && projected.y <= 1.15;
            const marker = infoMarkers[index];
            marker.style.display = visible ? "block" : "none";
            if (visible) {
              marker.style.left = `${(projected.x * 0.5 + 0.5) * rect.width}px`;
              marker.style.top = `${(-projected.y * 0.5 + 0.5) * rect.height}px`;
            }
          });
        }

        const originalRender = renderer.render;
        const anchoredRender = function (scene, camera) {
          const shifted = [];
          if (scene === xr._scene && !xr._ended) {
            for (const item of xr._placements || []) {
              const offset = item._userOffset;
              if (!offset || offset.lengthSq() === 0) continue;
              item.group.position.add(offset);
              if (item.shadow) item.shadow.position.add(offset);
              shifted.push(item);
            }
          }
          try {
            const result = originalRender.call(this, scene, camera);
            updateInfoMarkers();
            const now = performance.now();
            perfFrames += 1;
            if (now - perfWindowStart >= 1000) {
              const fps = Math.round(perfFrames * 1000 / (now - perfWindowStart));
              const stats = renderer.info?.render;
              const calls = stats?.calls ?? "?";
              const triangles = stats?.triangles;
              const triangleLabel = Number.isFinite(triangles)
                ? `${Math.round(triangles / 1000)}k tris`
                : "tris ?";
              perfBadge.textContent = `${fps} FPS · ${calls} calls · ${triangleLabel}`;
              perfFrames = 0;
              perfWindowStart = now;
            }
            return result;
          } finally {
            // Keep anchor-space positions untouched between frames. Offsets
            // exist only for the actual draw, so repeated renders cannot
            // accumulate the same translation.
            for (const item of shifted) {
              item.group.position.sub(item._userOffset);
              if (item.shadow) item.shadow.position.sub(item._userOffset);
            }
          }
        };
        renderer.render = anchoredRender;
        xr._session?.addEventListener("end", () => {
          if (renderer.render === anchoredRender) renderer.render = originalRender;
          perfBadge?.remove();
          infoToggle.remove();
          heightControl.remove();
          infoPanel.remove();
          for (const marker of infoMarkers) marker.remove();
        }, { once: true });
        const getModel = () => studio.placements[studio.placements.length - 1] || null;
        const isHudControl = (target) => !!target?.closest?.(
          'button, a, input, select, textarea, [role="button"], .ars-dock, .ars-tray, .ars-modal, .ars-top, .ars-selbar'
        );

        function stopEvent(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }

        // Use screen-space finger displacement mapped through a fixed,
        // horizontal camera basis captured when the gesture begins. Do not
        // unproject touches with xr._camera: Three.js uses an XR ArrayCamera
        // whose fov does not represent the actual headset/phone projection.
        function dragBasis(model, rect) {
          const xrCamera = xr._renderer.xr.getCamera(xr._camera);
          const viewCamera = xrCamera.cameras?.[0] || xrCamera;
          viewCamera.updateMatrixWorld(true);
          const position = viewCamera.getWorldPosition(new Vector3());
          const quaternion = viewCamera.getWorldQuaternion(viewCamera.quaternion.clone());
          const right = new Vector3(1, 0, 0).applyQuaternion(quaternion);
          right.y = 0;
          if (right.lengthSq() < 1e-6) return null;
          right.normalize();

          const screenUp = new Vector3(0, 1, 0).applyQuaternion(quaternion);
          screenUp.y = 0;
          if (screenUp.lengthSq() < 1e-6) {
            screenUp.copy(new Vector3(0, 0, -1).applyQuaternion(quaternion));
            screenUp.y = 0;
          }
          if (screenUp.lengthSq() < 1e-6) return null;
          screenUp.normalize();

          const forward = new Vector3(0, 0, -1).applyQuaternion(quaternion).normalize();
          const toModel = model.group.position.clone().sub(position);
          const depth = Math.max(0.25, toModel.dot(forward));
          const projectionY = Math.abs(viewCamera.projectionMatrix.elements[5]) || 1.7;
          const metresPerPixel = (2 * depth) / (projectionY * Math.max(1, rect.height));
          return { right, screenUp, metresPerPixel };
        }

        function touchDistance(touches) {
          return Math.hypot(
            touches[1].clientX - touches[0].clientX,
            touches[1].clientY - touches[0].clientY
          );
        }

        function touchAngle(touches) {
          return Math.atan2(
            touches[1].clientY - touches[0].clientY,
            touches[1].clientX - touches[0].clientX
          );
        }

        function beginGesture(touches) {
          const model = getModel();
          if (!model || (touches.length !== 1 && touches.length !== 2)) {
            gesture = null;
            return;
          }

          const group = model.group;
          const xrPlacement = xr._placements?.find((item) => item.group === group);
          if (!xrPlacement) {
            gesture = null;
            return;
          }
          if (!xrPlacement._userOffset) xrPlacement._userOffset = new Vector3();
          const startPosition = group.position.clone();
          const startOffset = xrPlacement._userOffset.clone();
          const floorY = startPosition.y;
          const isTransform = touches.length === 2;
          const overlayRect = root.getBoundingClientRect();
          const drag = !isTransform ? dragBasis(model, overlayRect) : null;

          gesture = {
            model,
            xrPlacement,
            mode: isTransform ? "transform" : "drag",
            startPosition,
            startOffset,
            floorY,
            startX: touches[0].clientX,
            startY: touches[0].clientY,
            drag,
            startScale: group.scale.x,
            startYaw: group.rotation.y,
            startDistance: isTransform ? Math.max(1, touchDistance(touches)) : 1,
            startAngle: isTransform ? touchAngle(touches) : 0
          };
        }

        function onStart(e) {
          if (isHudControl(e.target)) return;
          if (e.touches.length !== 1 && e.touches.length !== 2) return;
          stopEvent(e);
          beginGesture(e.touches);
          xr._uiTouchActive = true;
          xr._pinch.active = true;
        }

        function onMove(e) {
          if (!gesture) return;
          if (gesture.mode === "drag" && e.touches.length !== 1) return;
          if (gesture.mode === "transform" && e.touches.length !== 2) return;
          stopEvent(e);

          const group = gesture.model.group;

          if (gesture.mode === "drag") {
            if (!gesture.drag) return;
            const dx = e.touches[0].clientX - gesture.startX;
            const dy = e.touches[0].clientY - gesture.startY;
            const movement = gesture.drag.right.clone()
              .multiplyScalar(dx * gesture.drag.metresPerPixel * 1.6)
              .addScaledVector(gesture.drag.screenUp, -dy * gesture.drag.metresPerPixel * 1.6);
            movement.y = 0;
            // Translation is derived only from finger displacement since
            // touchstart, using a frozen world-space basis. Phone/camera
            // tracking updates therefore cannot make the object jump.
            gesture.xrPlacement._userOffset.copy(gesture.startOffset).add(movement);
          } else {
            const ratio = touchDistance(e.touches) / gesture.startDistance;
            const scale = Math.max(0.05, Math.min(5, gesture.startScale * ratio));
            group.scale.setScalar(scale);

            const angleDelta = touchAngle(e.touches) - gesture.startAngle;
            group.rotation.y = gesture.startYaw + angleDelta;
            gesture.model.yaw = group.rotation.y;

            // Scaling and twisting are deliberately pivoted around the
            // model's existing floor position; the two-finger midpoint does
            // not translate the object.
            group.position.copy(gesture.startPosition);
          }
        }

        function onEnd(e) {
          if (!gesture) return;
          stopEvent(e);

          if (e.touches && (e.touches.length === 1 || e.touches.length === 2)) {
            // Rebase when a finger is lifted so the remaining gesture does
            // not inherit an old distance, angle or drag offset.
            beginGesture(e.touches);
            return;
          }

          // Persist the translated world position without changing the
          // anchor-space base position used by the XR tracking loop.
          if (gesture.mode === "drag" && gesture.xrPlacement._userOffset) {
            const offset = gesture.xrPlacement._userOffset;
            gesture.model.group.position.add(offset);
            try { studio._saveScene(); }
            finally { gesture.model.group.position.sub(offset); }
          } else {
            studio._saveScene();
          }
          gesture = null;
          xr._uiTouchActive = false;
          xr._pinch.active = false;
          xr._pinchEndedAt = performance.now();
        }

        root.addEventListener("touchstart", onStart, { capture: true, passive: false });
        root.addEventListener("touchmove", onMove, { capture: true, passive: false });
        root.addEventListener("touchend", onEnd, { capture: true, passive: false });
        root.addEventListener("touchcancel", onEnd, { capture: true, passive: false });
      }

      // After the first placement, stop work that only exists to find another
      // placement. Keep the XR render loop and anchor pose updates so the model
      // remains locked to the real room.
      function reduceWorkAfterPlacement(xr) {
        if (!xr || xr._singleModelOptimized) return;
        xr._singleModelOptimized = true;

        if (xr._hitTestSource) {
          try { xr._hitTestSource.cancel(); } catch (error) {
            console.warn("Could not cancel XR hit-test source:", error);
          }
          xr._hitTestSource = null;
        }
        xr._latestHit = null;
        xr._hasHit = false;
        xr._hadHit = false;

        for (const object of [xr._reticle, xr._pulseRing]) {
          if (!object) continue;
          xr._scene.remove(object);
          object.traverse?.((child) => {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose?.());
            else child.material?.dispose?.();
          });
        }
        xr._reticle = null;
        xr._reticleRing = null;
        xr._reticleDot = null;
        xr._pulseRing = null;
        xr._pulse.active = false;

        // The scanned object is static: no per-frame mixer/idle animation work.
        xr._onFrame = null;

        // The contact shadow is another transparent draw over the camera view.
        // Remove it after placement; this single-object viewer does not need it.
        for (const placement of xr._placements || []) {
          const shadow = placement.shadow;
          if (!shadow) continue;
          xr._scene.remove(shadow);
          shadow.geometry?.dispose?.();
          if (Array.isArray(shadow.material)) shadow.material.forEach((m) => m.dispose?.());
          else shadow.material?.dispose?.();
          placement.shadow = null;
        }

        // Depth processing and real-world light estimation are not needed for
        // this simple single-object viewer.
        if (xr._depthOcclusion) {
          xr._depthOcclusion.dispose();
          xr._depthOcclusion = null;
        }
        if (studio.estimatedLight) {
          studio.estimatedLight.dispose();
          studio.estimatedLight = null;
        }

        installArGestures(xr);
        studio._setStatus("Model placed. Drag with one finger; pinch to resize and twist to rotate.");
      }

      // Do not even request optional depth-sensing or light-estimation features.
      // This prevents the AR runtime from enabling those optional pipelines.
      // Blur/translucency effects on the floating controls can trigger costly
      // mobile compositing over the live camera image. Keep the controls, drop
      // the expensive visual effects while immersive AR is active.
      const arPerformanceStyle = document.createElement("style");
      arPerformanceStyle.textContent = `
        .ars-root.is-xr .ars-hud *,
        .ars-root.is-xr .ars-hud *::before,
        .ars-root.is-xr .ars-hud *::after {
          -webkit-backdrop-filter: none !important;
          backdrop-filter: none !important;
          box-shadow: none !important;
          text-shadow: none !important;
          filter: none !important;
          transition: none !important;
        }
      `;
      document.head.appendChild(arPerformanceStyle);

      const originalToggleXR = studio._toggleXR.bind(studio);
      studio._toggleXR = async function (...args) {
        const xrApi = navigator.xr;
        const hadOwnRequestSession = Object.prototype.hasOwnProperty.call(xrApi, "requestSession");
        const originalRequestSession = xrApi.requestSession;
        let requestSessionPatched = false;

        try {
          xrApi.requestSession = function (mode, init = {}) {
            const options = { ...init };
            options.optionalFeatures = (init.optionalFeatures || []).filter(
              (feature) => feature !== "depth-sensing" && feature !== "light-estimation"
            );
            delete options.depthSensing;
            return originalRequestSession.call(this, mode, options);
          };
          requestSessionPatched = true;
        } catch (error) {
          console.warn("Could not filter optional WebXR features:", error);
        }

        try {
          await originalToggleXR(...args);
        } finally {
          if (requestSessionPatched) {
            try {
              if (hadOwnRequestSession) xrApi.requestSession = originalRequestSession;
              else delete xrApi.requestSession;
            } catch (error) {
              console.warn("Could not restore WebXR requestSession:", error);
            }
          }
        }

        const xr = this.xrSession;
        if (!xr) return;

        // The Add controls stay locked until the hit-test has a live floor
        // result (the visible placement circle). They lock again once a model
        // is armed or placed, preventing out-of-order commands.
        this._syncArAddControls = (hasFloor = !!xr._hasHit) => {
          setArAddControls(xr, hasFloor);
        };
        const previousOnHit = xr._onHit;
        xr._onHit = (hasFloor) => {
          previousOnHit?.(hasFloor);
          setArAddControls(xr, hasFloor);

          if (this._armed?.src && !hasFloor) {
            this._setStatus("Floor not detected. Point at the floor until the placement circle returns.", {
              warn: true, sticky: true
            });
          } else if (this._armed?.src && hasFloor) {
            this._setStatus("Model ready. Tap the visible placement circle to place it.", { sticky: true });
          } else if (hasFloor && xr.placedCount === 0) {
            this._setStatus("Floor detected. Add a model, then tap the placement circle to place it.", { sticky: true });
          } else if (!hasFloor && xr.placedCount === 0) {
            this._setStatus("Point at a floor until the placement circle appears. Add will unlock when it is detected.", {
              sticky: true
            });
          }
        };

        // Keep this in place for the first placement and run it immediately if
        // the model was already placed before entering AR.
        if (xr.placedCount > 0) reduceWorkAfterPlacement(xr);
        const previousOnPlaced = xr._onPlaced;
        xr._onPlaced = (...placedArgs) => {
          previousOnPlaced?.(...placedArgs);
          reduceWorkAfterPlacement(xr);
          setArAddControls(xr, false);
        };

        // Initial state matters: the session may not have received its first
        // hit-test result by the time the AR transition resolves.
        setArAddControls(xr, !!xr._hasHit);
        if (xr.placedCount === 0) {
          if (this._armed?.src) {
            this._setStatus(xr._hasHit
              ? "Model ready. Tap the visible placement circle to place it."
              : "Model ready. Point at a floor until the placement circle appears.");
          } else {
            this._setStatus(xr._hasHit
              ? "Floor detected. Add a model, then tap the placement circle to place it."
              : "Point at a floor until the placement circle appears. Add will unlock when it is detected.",
              { sticky: true });
          }
        }
        xr._session?.addEventListener("end", () => {
          this._syncArAddControls = null;
          for (const control of [
            this.ui.addBtn,
            this.ui.emptyAdd,
            ...(this.ui.root?.querySelectorAll(".ars-item-add") || [])
          ]) {
            if (control) {
              control.disabled = false;
              control.removeAttribute("aria-disabled");
              control.removeAttribute("title");
            }
          }
        }, { once: true });
      };

      // Start with an empty scene. The user chooses the model from the catalogue
      // and places it only after aiming at the desired surface in AR.
    } catch (error) {
      showStartupError(error);
    }
  </script>
</body>
</html>
