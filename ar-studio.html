<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }
    #studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
    #startup-error {
      position: fixed;
      z-index: 99999;
      inset: 12px 12px auto;
      padding: 14px;
      border-radius: 10px;
      background: #3b1515;
      color: white;
      font: 14px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="studio"></div>
  <div id="startup-error" hidden></div>

  <script type="module">
    const errorBox = document.querySelector("#startup-error");

    function showStartupError(error) {
      console.error("AR Studio startup failed:", error);
      errorBox.hidden = false;
      errorBox.textContent =
        "AR Studio could not start. Please reload the page.\n\n" +
        (error?.message || String(error));
    }

    try {
      // Dynamic import lets us show a useful error instead of a completely
      // blank page if the CDN bundle cannot be downloaded or evaluated.
      const { createArStudio } = await import(
        "https://unpkg.com/3d-ar-studio@0.3.1/dist/ar-studio.min.js"
      );

      if (typeof createArStudio !== "function") {
        throw new Error("The AR Studio bundle loaded, but createArStudio was not exported.");
      }

      const studio = createArStudio(document.querySelector("#studio"), {
        assets: "https://mihajamer.github.io/ar-3d-models/models.json",
        branding: {
          title: "Scanned Objects",
          accent: "#2563eb"
        },
        generate: { enabled: false },
        rooms: { enabled: false },
        animations: { enabled: false },
        maxPlacements: 1,
        persist: false,
        allowUrlOverride: false
      });

      // Mobile rendering budget:
      // - cap the drawing buffer at the screen's native CSS resolution;
      // - disable WebGL shadow maps;
      // - omit the studio's separate soft contact-shadow mesh.
      // The studio's normal mobile tier can otherwise use a 1.5x pixel ratio.
      studio.renderer.setPixelRatio(0.8);
      studio.renderer.shadowMap.enabled = false;
      studio._makeShadow = () => null;

      // WebXR uses its own framebuffer; setPixelRatio() above does not lower
      // immersive-AR resolution. Render XR at 70% linear resolution to reduce
      // GPU fill-rate cost on mobile (about 49% of the full-resolution pixels).
      // This must be set before renderer.xr.setSession() is called.
      if (typeof studio.renderer.xr.setFramebufferScaleFactor === "function") {
        studio.renderer.xr.setFramebufferScaleFactor(0.7);
      }

      // maxPlacements is checked by the library before its asynchronous GLB
      // load. Reserve the single slot while that load is pending, preventing
      // rapid taps from starting multiple model loads simultaneously.
      const originalAddModel = studio._addModel.bind(studio);
      let pendingPlacements = 0;

      studio._addModel = async function (model, options) {
        const limit = this._maxPlacements;
        if (this.placements.length + pendingPlacements >= limit) {
          this._setStatus(
            "Scene is full (1 model). Remove it before adding another.",
            { warn: true }
          );
          return null;
        }

        pendingPlacements += 1;
        try {
          return await originalAddModel(model, options);
        } finally {
          pendingPlacements -= 1;
        }
      };

      // WebXR floor taps use a separate synchronous path: _armedContent()
      // creates placements directly and does not call _addModel(). Guard that
      // path too, so the first floor tap consumes the only allowed slot.
      const originalArmedContent = studio._armedContent.bind(studio);
      studio._armedContent = function () {
        if (this.placements.length >= this._maxPlacements) {
          this._setStatus(
            "Only one model can be placed. Remove it before placing another.",
            { warn: true }
          );
          return null;
        }
        return originalArmedContent();
      };

      // Use the same guarded path as the Add tray for the first model.
      const firstPlacement = await studio.addModel({
        src: "https://mihajamer.github.io/ar-3d-models/test1.glb",
        title: "Test Object 1"
      });

      if (!firstPlacement) {
        console.warn("The initial model was not placed. Check the model URL and CORS response.");
      }
    } catch (error) {
      showStartupError(error);
    }
  </script>
</body>
</html>
