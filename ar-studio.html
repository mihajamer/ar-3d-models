<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanned Objects - AR Studio</title>

  <!-- Load the default model into the scene on first visit.
       The studio reads ?src= and ?title= as documented deep-link parameters. -->
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      if (!params.has("src")) {
        params.set("src", "https://mihajamer.github.io/ar-3d-models/test1.glb");
        params.set("title", "Test Object 1");
        window.location.replace(
          window.location.pathname + "?" + params.toString() + window.location.hash
        );
      }
    })();
  </script>

  <!-- Keep the same browser bundle and custom-element integration as the
       previously working version. -->
  <script type="module"
    src="https://unpkg.com/3d-ar-studio/dist/ar-studio.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
    }

    ar-studio {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 70vh;
    }
  </style>
</head>
<body>
  <ar-studio
    assets="https://mihajamer.github.io/ar-3d-models/models.json"
    title="Scanned Objects"
    accent="#2563eb"
    generate="false"
    rooms="false">
  </ar-studio>

  <script>
    // The custom element creates its actual studio instance in connectedCallback.
    // Wait until that instance exists before applying the one-model cap.
    // requestAnimationFrame avoids the race in which whenDefined() resolves
    // before the element has finished connecting and assigning element.studio.
    customElements.whenDefined("ar-studio").then(() => {
      const element = document.querySelector("ar-studio");

      const applyPlacementLimit = () => {
        if (!element || !element.studio) {
          requestAnimationFrame(applyPlacementLimit);
          return;
        }

        element.studio.config.maxPlacements = 1;
        element.studio._maxPlacements = 1;
      };

      requestAnimationFrame(applyPlacementLimit);
    });
  </script>
</body>
</html>
