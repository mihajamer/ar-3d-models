
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>3D Model - Test 1</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background: #f5f5f5;
        }

        p {
            color: #666;
        }

        #ar-button {
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Test Object 1</h1>
    <p>Interactive 3D model</p>

    <model-viewer
        src="test1.gltf"
        ios-src="test1.usdz"

        ar
        ar-modes="scene-viewer webxr quick-look"

        camera-controls
        auto-rotate

        shadow-intensity="1"
        exposure="1"

        alt="3D scanned object">

        <button id="ar-button" slot="ar-button">
            View in AR
        </button>

    </model-viewer>

    <p>
        Rotate and explore the model, or view it in augmented reality.
    </p>

</body>
</html>
