
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Test Object 1 - 3D Viewer</title>

    <!-- Google Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        header {
            padding: 24px 15px 10px;
        }

        h1 {
            font-size: 25px;
            margin: 0 0 10px;
        }

        .description {
            color: #666;
            font-size: 15px;
            margin: 0 0 15px;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            min-height: 350px;
            background: #f5f5f5;
            --poster-color: #f5f5f5;
        }

        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        #ar-button:focus {
            outline: 2px solid #777;
            outline-offset: 3px;
        }

        .instructions {
            padding: 15px 20px 30px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        footer {
            padding: 10px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <header>
        <h1>Test Object 1</h1>
        <p class="description">Interactive 3D model</p>
    </header>

    <model-viewer
        src="test1.gltf"
        ios-src="test1.usdz"

        alt="3D scanned object"

        ar
        ar-modes="scene-viewer webxr quick-look"

        camera-controls
        auto-rotate

        shadow-intensity="1"
        exposure="1"

        environment-image="neutral"
        interaction-prompt="auto">

        <button id="ar-button" slot="ar-button">
            View in AR
        </button>

    </model-viewer>

    <div class="instructions">
        Rotate and explore the model using your finger or mouse.

        <br>

        Press <strong>View in AR</strong> to place the object
        in your surroundings.
    </div>

    <footer>
        3D Interactive Viewer
    </footer>

</body>
</html>
