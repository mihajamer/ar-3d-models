
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Test Object 1</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        h2 {
            margin-top: 30px;
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background: #f5f5f5;
        }

        #ar-button {
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Test Object 1</h2>
    <p>Interactive 3D model</p>

    <model-viewer
        id="viewer"
        src="test1.gltf"
        ios-src="test1.usdz"
        alt="3D scanned object"

        ar
        ar-modes="scene-viewer webxr quick-look"

        camera-controls
        auto-rotate

        shadow-intensity="1"
        exposure="1">

        <button id="ar-button" slot="ar-button">
            View in AR
        </button>

    </model-viewer>

    <p>Rotate and explore the model, or view it in augmented reality.</p>

    <script>
        const viewer = document.querySelector("#viewer");

        viewer.addEventListener("load", () => {
            console.log("Model loaded successfully");
            console.log("Model dimensions:", viewer.getDimensions());
            console.log("Model center:", viewer.getBoundingBoxCenter());
        });

        viewer.addEventListener("error", (event) => {
            console.error("Model loading error:", event);
        });
    </script>

</body>
</html>
